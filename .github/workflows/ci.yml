name: Android Build & ProGuard Showcase CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Test, Lint, Debug & ProGuard Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate CI signing keystore
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/ci-release.keystore"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -alias "androiddebugkey" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "android" \
            -keypass "android" \
            -dname "CN=Android Debug, OU=CI, O=ReflectionsDemo, L=Berlin, ST=Berlin, C=DE"
          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
          echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
          echo "KEY_PASSWORD=android" >> $GITHUB_ENV

      - name: Run unit tests (verifies build-time index + APK collect)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build Debug APK, ProGuard/R8 Release APK, AAB, and AndroidTest APK
        run: ./gradlew assembleDebug assembleRelease bundleRelease assembleDebugAndroidTest --stacktrace

      - name: Verify ProGuard/R8 APK contains pre-scanned Reflections metadata and classes.dex
        run: |
          python3 - << 'EOF'
          import zipfile, os, sys

          apk_path = "app/build/outputs/apk/release/app-release.apk"
          mapping_path = "app/build/outputs/mapping/release/mapping.txt"
          assert os.path.exists(apk_path), f"Missing {apk_path}"
          assert os.path.exists(mapping_path), f"Missing R8 mapping file {mapping_path}"

          with zipfile.ZipFile(apk_path, "r") as zf:
              names = set(zf.namelist())
              required = {
                  "AndroidManifest.xml",
                  "classes.dex",
                  "META-INF/reflections/demo-reflections.json",
                  "META-INF/reflections/demo-reflections.xml",
              }
              missing = required - names
              assert not missing, f"Release APK missing expected entries: {missing}"
              print("Verified release APK entries:", sorted(required))
          EOF

      - name: Upload build artifacts and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-demo-outputs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/
            app/build/reports/tests/
            app/build/reports/lint-results*.html

